<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>访问验证 · MONY</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v2.png">
    <link rel="stylesheet" href="/overview-v5.css">
    <script src="/locale-v4.js" defer></script>
    <script src="/login.js" defer></script>
</head>
<body>
    <header class="titlebar"><img src="/brand.svg" width="20" height="20" alt=""><span>MONY</span></header>
    <main class="login">
        <form id="login-form" class="card">
            <h1>访问验证</h1>
            <p>输入为此服务配置的访问密码。登录后 1 天内免重复验证。</p>
            <label for="password">访问密码</label>
            <input id="password" type="password" autocomplete="current-password" required autofocus>
            <p id="login-message" role="status"></p>
            <div class="actions">
                <a id="login-back" class="button" href="/">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6M8 12h12"/></svg>
                    <span>返回性能概览</span>
                </a>
                <button id="login-submit" type="submit">登录</button>
            </div>
        </form>
    </main>
</body>
</html>
